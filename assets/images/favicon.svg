<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crossed hammer and screwdriver">
  <rect width="64" height="64" rx="12" fill="#2f6f93"/>
  <g fill="#fafafa" transform="translate(-3.7 2.1)">
    <!-- Hammer: head + handle -->
    <g transform="rotate(45 32 32)">
      <rect x="14" y="12" width="36" height="12" rx="3"/>
      <rect x="27" y="22" width="10" height="30" rx="4"/>
    </g>
    <!-- Screwdriver: tip + shaft + handle -->
    <g transform="rotate(-45 32 32)">
      <rect x="29" y="10" width="6" height="10"/>
      <rect x="29.5" y="18" width="5" height="20"/>
      <rect x="25" y="36" width="14" height="16" rx="4"/>
    </g>
  </g>
</svg>
